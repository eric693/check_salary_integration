<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工考勤薪資系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --gray: #6b7280;
            --light: #f3f4f6;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
        }

        /* Loading Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login Page */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-container {
            background: var(--white);
            border-radius: 24px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.6s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .logo svg {
            width: 40px;
            height: 40px;
            color: white;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--gray);
            font-size: 1rem;
        }

        .line-login-btn {
            width: 100%;
            padding: 1rem;
            background: #06C755;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
        }

        .line-login-btn:hover {
            background: #05B34A;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 199, 85, 0.4);
        }

        .line-login-btn:active {
            transform: translateY(0);
        }

        /* Main App */
        .app-container {
            display: none;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .app-header {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .app-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .header-subtitle {
            font-size: 0.875rem;
            color: var(--gray);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            background: var(--light);
            border-radius: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .user-info h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--dark);
        }

        .user-info p {
            font-size: 0.75rem;
            color: var(--gray);
        }

        .logout-btn {
            padding: 0.625rem 1.25rem;
            background: var(--white);
            border: 2px solid var(--danger);
            color: var(--danger);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: var(--white);
            transform: translateY(-2px);
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* Cards */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon svg {
            width: 22px;
            height: 22px;
            color: white;
        }

        .card-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--light);
            border-radius: 10px;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-input:disabled {
            background: var(--light);
            cursor: not-allowed;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-success {
            background: var(--secondary);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-warning:hover:not(:disabled) {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-full {
            width: 100%;
        }

        /* Status Display */
        .status-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .status-item:not(:last-child) {
            border-bottom: 1px solid rgba(37, 99, 235, 0.1);
        }

        .status-label {
            font-size: 0.875rem;
            color: var(--gray);
            font-weight: 500;
        }

        .status-value {
            font-size: 0.9375rem;
            color: var(--dark);
            font-weight: 600;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--light);
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--gray);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: var(--primary);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
        }

        .tab:hover {
            color: var(--primary);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            margin-top: 1rem;
            border-radius: 10px;
            border: 1px solid var(--light);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.875rem;
            color: white;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--light);
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--light);
        }

        .action-btn {
            padding: 0.375rem 0.875rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 0.25rem;
        }

        .action-btn.edit {
            background: var(--primary);
            color: white;
        }

        .action-btn.delete {
            background: var(--danger);
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        /* Messages */
        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--secondary);
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid var(--primary);
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        /* Result Display */
        .result-card {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .result-header {
            font-size: 1.125rem;
            font-weight: 700;
            color: #92400e;
            margin-bottom: 1rem;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .result-item {
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .result-item-label {
            font-size: 0.75rem;
            color: var(--gray);
            margin-bottom: 0.25rem;
        }

        .result-item-value {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--dark);
        }

        .result-highlight {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1.5rem;
            padding: 1rem;
        }

        .result-highlight .result-item-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .result-highlight .result-item-value {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
            }

            .header-right {
                width: 100%;
                flex-direction: column;
            }

            .user-profile {
                width: 100%;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .tab {
                white-space: nowrap;
            }
        }

        /* Utility Classes */
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h1>考勤薪資系統</h1>
                <p>請使用 LINE 帳號登入以繼續使用</p>
            </div>
            <button class="line-login-btn" onclick="lineLogin()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                </svg>
                使用 LINE 登入
            </button>
            <div id="loginMessage" class="message"></div>
            <div id="loginLoading" class="loading">
                <div class="spinner"></div>
                <p>登入中...</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="app-container">
        <div class="app-wrapper">
            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <div class="app-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="header-title">
                        <h1>考勤薪資系統</h1>
                        <div class="header-subtitle" id="currentDateTime"></div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <img id="userAvatar" class="user-avatar" src="" alt="User">
                        <div class="user-info">
                            <h3 id="userName"></h3>
                            <p id="userRole"></p>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="logout()">登出</button>
                </div>
            </header>

            <!-- Dashboard Grid -->
            <div class="dashboard-grid">
                <!-- Clock In/Out Card -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <h2>員工打卡</h2>
                    </div>
                    <div class="form-group">
                        <label class="form-label">員工編號</label>
                        <input type="text" class="form-input" id="employeeId" placeholder="請輸入員工編號">
                    </div>
                    <div class="form-group">
                        <label class="form-label">員工姓名</label>
                        <input type="text" class="form-input" id="employeeName" placeholder="請輸入員工姓名">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="clockIn()">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"/>
                            </svg>
                            上班打卡
                        </button>
                        <button class="btn btn-danger" onclick="clockOut()">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"/>
                            </svg>
                            下班打卡
                        </button>
                    </div>
                    <div id="clockMessage" class="message"></div>
                    <div id="clockStatus" class="status-card hidden">
                        <div class="status-item">
                            <span class="status-label">最後打卡時間</span>
                            <span class="status-value" id="lastClockTime">-</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">打卡類型</span>
                            <span class="status-value" id="lastClockType">-</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">今日工時</span>
                            <span class="status-value" id="todayHours">0 小時</span>
                        </div>
                    </div>
                </div>

                <!-- Employee Management Card -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <h2>員工管理</h2>
                    </div>
                    <div class="form-group">
                        <label class="form-label">員工編號</label>
                        <input type="text" class="form-input" id="newEmployeeId" placeholder="例如：E001">
                    </div>
                    <div class="form-group">
                        <label class="form-label">員工姓名</label>
                        <input type="text" class="form-input" id="newEmployeeName" placeholder="請輸入姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">月薪金額</label>
                        <input type="number" class="form-input" id="newEmployeeSalary" placeholder="例如：40000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">部門</label>
                        <input type="text" class="form-input" id="newEmployeeDepartment" placeholder="例如：業務部">
                    </div>
                    <div class="form-group">
                        <label class="form-label">職位</label>
                        <input type="text" class="form-input" id="newEmployeePosition" placeholder="例如：專員">
                    </div>
                    <button class="btn btn-primary btn-full" onclick="addEmployee()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        新增員工
                    </button>
                    <div id="employeeMessage" class="message"></div>
                </div>
            </div>

            <!-- Salary & Reports Card -->
            <div class="card full-width">
                <div class="card-header">
                    <div class="card-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <h2>薪資計算與報表</h2>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab(event, 'salary')">薪資計算</button>
                    <button class="tab" onclick="switchTab(event, 'attendance')">出勤記錄</button>
                    <button class="tab" onclick="switchTab(event, 'report')">月報表</button>
                </div>

                <!-- Salary Tab -->
                <div id="salaryTab" class="tab-content active">
                    <div class="dashboard-grid">
                        <div class="form-group">
                            <label class="form-label">選擇員工</label>
                            <select class="form-select" id="salaryEmployeeId">
                                <option value="">請選擇員工</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">計算月份</label>
                            <input type="month" class="form-input" id="salaryMonth">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="calculateSalary()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                        計算薪資
                    </button>
                    <div id="salaryResult" class="result-card hidden">
                        <div class="result-header">薪資明細</div>
                        <div class="result-grid">
                            <div class="result-item">
                                <div class="result-item-label">員工姓名</div>
                                <div class="result-item-value" id="resultName">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">計算月份</div>
                                <div class="result-item-value" id="resultMonth">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">基本月薪</div>
                                <div class="result-item-value" id="resultBaseSalary">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">應出勤天數</div>
                                <div class="result-item-value" id="resultRequiredDays">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">實際出勤天數</div>
                                <div class="result-item-value" id="resultActualDays">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">總工時</div>
                                <div class="result-item-value" id="resultTotalHours">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">加班費</div>
                                <div class="result-item-value" id="resultOvertimePay">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-item-label">扣款</div>
                                <div class="result-item-value" id="resultDeduction">-</div>
                            </div>
                            <div class="result-item result-highlight">
                                <div class="result-item-label">實發薪資</div>
                                <div class="result-item-value" id="resultNetSalary">-</div>
                            </div>
                        </div>
                    </div>
                    <div id="salaryMessage" class="message"></div>
                </div>

                <!-- Attendance Tab -->
                <div id="attendanceTab" class="tab-content">
                    <div class="dashboard-grid">
                        <div class="form-group">
                            <label class="form-label">員工</label>
                            <select class="form-select" id="attendanceEmployeeId">
                                <option value="">全部員工</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">開始日期</label>
                            <input type="date" class="form-input" id="attendanceStartDate">
                        </div>
                        <div class="form-group">
                            <label class="form-label">結束日期</label>
                            <input type="date" class="form-input" id="attendanceEndDate">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="queryAttendance()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        查詢記錄
                    </button>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>員工編號</th>
                                    <th>姓名</th>
                                    <th>上班時間</th>
                                    <th>下班時間</th>
                                    <th>工時</th>
                                    <th>狀態</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceTableBody">
                                <tr>
                                    <td colspan="7" style="text-align: center; color: var(--gray);">請選擇條件後查詢</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="attendanceMessage" class="message"></div>
                </div>

                <!-- Report Tab -->
                <div id="reportTab" class="tab-content">
                    <div class="dashboard-grid">
                        <div class="form-group">
                            <label class="form-label">報表月份</label>
                            <input type="month" class="form-input" id="reportMonth">
                        </div>
                        <div class="form-group">
                            <label class="form-label">部門篩選</label>
                            <select class="form-select" id="reportDepartment">
                                <option value="">全部部門</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="generateReport()">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            生成報表
                        </button>
                        <button class="btn btn-success" onclick="exportReport()">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            匯出Excel
                        </button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>員工編號</th>
                                    <th>姓名</th>
                                    <th>部門</th>
                                    <th>職位</th>
                                    <th>出勤天數</th>
                                    <th>總工時</th>
                                    <th>基本薪資</th>
                                    <th>加班費</th>
                                    <th>實發薪資</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody">
                                <tr>
                                    <td colspan="9" style="text-align: center; color: var(--gray);">請選擇月份後生成報表</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="reportMessage" class="message"></div>
                </div>
            </div>

            <!-- Employee List Card -->
            <div class="card full-width">
                <div class="card-header">
                    <div class="card-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                    </div>
                    <h2>員工列表</h2>
                </div>
                <button class="btn btn-warning mb-2" onclick="loadEmployees()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    重新載入
                </button>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>員工編號</th>
                                <th>姓名</th>
                                <th>部門</th>
                                <th>職位</th>
                                <th>月薪</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--gray);">載入中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
